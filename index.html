<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>38인의 수학생각 LMS</title>
<meta name="description" content="38인의 수학생각 재원생 복습 강의실">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --side:#F7F7F8; --ink:#111113; --ink2:#3F3F46; --mu:#71717A; --mu2:#A1A1AA;
  --ln:#E4E4E7; --soft:#F4F4F5; --black:#111113; --ok:#16A34A; --err:#DC2626;
  --f-title:"Gothic A1","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --side-w:272px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.nw{white-space:nowrap}

/* ---------- 레이아웃 ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--side) calc(var(--side-w) - 1px),var(--ln) calc(var(--side-w) - 1px),var(--ln) var(--side-w),var(--bg) var(--side-w))}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);border-right:1px solid var(--ln);padding:22px 14px 24px;display:flex;flex-direction:column}
.main{min-width:0}
.inner{max-width:940px;padding:30px 40px 0}

/* 사이드바 */
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 20px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--black);color:#fff;display:grid;place-items:center;font-family:var(--f-title);font-weight:800;font-size:13px;flex:none}
.brand b{font-family:var(--f-title);font-weight:800;font-size:15px;line-height:1.25;display:block}
.brand small{display:block;font-size:12px;color:var(--mu)}
.slab{font-size:12px;color:var(--mu);padding:10px 10px 6px;font-weight:500}
.clist{display:flex;flex-direction:column;gap:2px}
.citem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;text-align:left;width:100%}
.citem:hover{background:#EFEFF1}
.citem.on{background:#fff;box-shadow:0 0 0 1px var(--ln),0 1px 2px rgba(0,0,0,.04)}
.code{width:34px;height:34px;border-radius:9px;background:#fff;border:1px solid var(--ln);display:grid;place-items:center;font-family:var(--f-title);font-weight:800;font-size:12.5px;flex:none}
.citem.on .code{background:var(--black);border-color:var(--black);color:#fff}
.ctext{min-width:0;line-height:1.35}
.ctext b{display:block;font-weight:500;font-size:13.5px;word-break:keep-all}
.ctext small{display:block;font-size:12px;color:var(--mu)}
.cnew{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.snote{margin-top:auto;padding:16px 10px 0;border-top:1px solid var(--ln);font-size:12.5px;color:var(--mu);line-height:1.7}
.snote p{margin:0 0 6px;word-break:keep-all}
.snote .t{font-weight:700;color:var(--ink2);margin-bottom:4px}

/* 공통 */
.crumb{font-size:13px;color:var(--mu);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb b{color:var(--ink2);font-weight:700}
h1.ttl{font-family:var(--f-title);font-weight:800;font-size:28px;line-height:1.3;letter-spacing:-.02em;margin:6px 0 4px;word-break:keep-all}
.sub{color:var(--mu);font-size:14.5px;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--ln);background:#fff;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--black);border-color:var(--black);color:#fff}
.btn.pri:hover{background:#000}
.btn.ok{background:#fff;border-color:var(--ok);color:var(--ok)}
.btn:disabled{opacity:.4;cursor:default}
.h2{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:34px 0 10px}
.h2 h2{font-family:var(--f-title);font-weight:800;font-size:18px;margin:0}
.h2 .meta{font-size:13px;color:var(--mu)}
.box{border:1px solid var(--ln);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--ink2)}
.box p{margin:0;word-break:keep-all}.box p+p{margin-top:4px}
.box.note{background:var(--soft);border-color:var(--soft)}
.box.note b{margin-right:6px}

/* 홈 */
.rows{border-top:1px solid var(--ln);margin-top:22px}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto 16px;align-items:center;gap:14px;padding:16px 6px;border-bottom:1px solid var(--ln);border-radius:0}
.row:hover{background:var(--side)}
.row .code{width:44px;height:44px;border-radius:12px;font-size:14px;background:var(--black);border-color:var(--black);color:#fff}
.row .nm{display:block;font-weight:700;font-size:16px;word-break:keep-all}
.row .dt{display:block}
.row .dt{font-size:13px;color:var(--mu)}
.row .dt em{font-style:normal;color:var(--ok);font-weight:700}
.row .pr{text-align:right;font-size:13px;color:var(--mu);white-space:nowrap}
.row .pr b{display:block;font-size:16px;color:var(--ink)}
.chev{width:8px;height:8px;border-top:2px solid var(--mu2);border-right:2px solid var(--mu2);transform:rotate(45deg)}

/* 강의 */
.player{margin-top:18px;position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#18181B}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#A1A1AA;font-size:14px;padding:20px}
.player .empty b{display:block;color:#fff;font-size:17px;margin-bottom:4px}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.acts .sp{flex:1}
.copied{font-size:13px;color:var(--ok)}
.panel{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.pbox{border:1px solid var(--ln);border-radius:12px;padding:14px 16px}
.pbox h3{font-size:13px;color:var(--mu);font-weight:500;margin:0 0 8px}
.flow{list-style:none;margin:0;padding:0}
.flow button{display:flex;gap:12px;width:100%;text-align:left;padding:7px 6px;border-radius:8px;font-size:14px}
.flow button:hover:not(:disabled){background:var(--soft)}
.flow .t{font-family:var(--f-mono);font-size:13px;color:var(--mu);min-width:52px}
.qa{display:block;width:100%;text-align:left;padding:9px 6px;border-radius:8px;font-size:14px}
.qa+.qa{border-top:1px solid var(--soft)}
.qa .a{display:none;margin-top:4px;color:var(--ok);font-weight:700}
.qa .tap{font-size:12px;color:var(--mu2)}
.qa.open .a{display:block}.qa.open .tap{display:none}
.search{height:36px;border:1px solid var(--ln);border-radius:9px;padding:0 12px;font:inherit;font-size:14px;width:200px;max-width:50vw;background:#fff;color:var(--ink)}
.search:focus{outline:none;border-color:var(--ink)}
.unit{font-size:12.5px;color:var(--mu);font-weight:700;padding:16px 6px 6px}
.lec{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 6px;border-top:1px solid var(--ln)}
.lec:hover{background:var(--side)}
.lec .n{font-size:13px;color:var(--mu)}
.lec .tt{font-size:15px;word-break:keep-all}
.lec .dd{display:block;font-size:12.5px;color:var(--mu)}
.lec.cur{background:var(--side)}
.lec.cur .tt{font-weight:700}
.lec.cur .n{color:var(--ink);font-weight:700}
.lec.prep{cursor:default}.lec.prep .tt{color:var(--mu)}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;white-space:nowrap;border:1px solid var(--ln);color:var(--mu)}
.pill.done{background:var(--black);border-color:var(--black);color:#fff}
.pill.todo{border-color:var(--ink);color:var(--ink)}
.pill.prep{background:var(--soft);border-color:var(--soft);color:var(--mu2)}
.lecs{border-bottom:1px solid var(--ln)}
.res{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 6px;border-top:1px solid var(--ln);font-size:14px}
.res:last-child{border-bottom:1px solid var(--ln)}
.res small{display:block;font-size:12.5px;color:var(--mu)}
.res .go{font-size:13px;color:var(--mu);white-space:nowrap}
a.res:hover{background:var(--side)}
.emptymsg{padding:28px 6px;color:var(--mu);font-size:14px}
.foot{margin-top:48px;padding:20px 0 40px;border-top:1px solid var(--ln);font-size:12px;line-height:1.75;color:var(--mu2);white-space:pre-line;word-break:keep-all}

/* 입장 코드 */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--side)}
.gcard{width:100%;max-width:400px;background:#fff;border:1px solid var(--ln);border-radius:18px;padding:30px 26px 24px}
.gcard .brand{padding:0 0 22px}
.gcard h1{font-family:var(--f-title);font-weight:800;font-size:22px;margin:0 0 4px}
.gcard .sub{margin-bottom:20px}
.gin{width:100%;height:50px;border:1px solid var(--ln);border-radius:12px;padding:0 14px;font-family:var(--f-title);font-weight:700;font-size:18px;letter-spacing:.08em;color:var(--ink);background:#fff}
.gin::placeholder{letter-spacing:0;font-weight:500;color:var(--mu2);font-size:15px}
.gin:focus{outline:none;border-color:var(--ink)}
select.gin{font-size:15px;letter-spacing:0;margin-bottom:8px}
.gcard .btn{width:100%;height:50px;margin-top:10px;font-size:15px}
.gmsg{min-height:20px;margin:10px 0 0;font-size:13px;word-break:keep-all}
.gmsg.err{color:var(--err)}
.gmsg code{display:block;margin-top:6px;padding:10px 12px;background:var(--soft);border-radius:8px;font-family:var(--f-mono);font-size:12px;word-break:break-all;user-select:all;color:var(--ink)}
.gnote{margin:14px 0 0;padding-top:14px;border-top:1px solid var(--ln);font-size:12.5px;color:var(--mu);word-break:keep-all}

/* ---------- 휴대폰 ---------- */
@media (max-width:860px){
  .app{grid-template-columns:1fr;background:var(--bg)}
  .side{position:sticky;top:0;z-index:10;height:auto;overflow:visible;flex-direction:column;padding:10px 0 0;border-right:0;border-bottom:1px solid var(--ln);background:rgba(247,247,248,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .brand{padding:0 16px 8px}
  .logo{width:28px;height:28px;font-size:12px;border-radius:8px}
  .slab,.snote{display:none}
  .clist{flex-direction:row;overflow-x:auto;gap:6px;padding:0 16px 10px;scrollbar-width:none}
  .clist::-webkit-scrollbar{display:none}
  .citem{width:auto;flex:none;padding:5px 12px 5px 5px;border-radius:999px;background:#fff;box-shadow:0 0 0 1px var(--ln)}
  .citem .code{width:28px;height:28px;border-radius:999px;font-size:11.5px}
  .citem .ctext small{display:none}
  .citem .ctext b{font-size:13px;font-weight:700}
  .citem .cnew{margin-left:2px}
  .citem.on{background:var(--black);box-shadow:none;color:#fff}
  .citem.on .code{background:#fff;color:var(--black)}
  .inner{padding:20px 16px 0}
  h1.ttl{font-size:22px}
  .player{margin-left:-16px;margin-right:-16px;border-radius:0}
  .panel{grid-template-columns:1fr}
  .acts .btn{flex:1}
  .acts .sp{display:none}
  .row{grid-template-columns:44px minmax(0,1fr) 12px;gap:12px}
  .row .pr{grid-column:2;text-align:left;margin-top:-6px}
  .row .pr b{display:inline;font-size:13px;margin-right:4px}
  .row .chev{grid-row:1;grid-column:3}
  .search{width:150px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<div id="root"></div>
<script>
/* =====================================================================

const CLASSES = [
  {
    id: 'a', name: '[M1] 중1 2-1실력A 2-2실력B', sub: '',
    days: '월·수·금', time: '1부',

  const all = sorted(c).slice().reverse();
  const L = all.filter(l => !q || (l.unit + ' ' + l.title + ' ' + l.no + '차').toLowerCase().includes(q));
  if (!L.length) return '<div class="emptymsg">‘' + esc(qFilter) + '’에 맞는 강의가 없어요.</div>';
  let last = null, h = '<div class="lecs">';
  L.forEach(l => {
    if ((l.unit || '') !== last) { last = l.unit || ''; if (last) h += '<div class="unit">' + esc(last) + '</div>'; }
    const r = ready(l), d = r && store.get(c.id, l.no), cur = lec && lec.no === l.no;
    h += '<button class="lec' + (cur ? ' cur' : '') + (r ? '' : ' prep') + '" data-no="' + l.no + '"' + (cur ? ' aria-current="true"' : '') + '><span class="n">' + l.no + '차</span>' +
      '<span><span class="tt">' + esc(l.title) + '</span><span class="dd">' + esc(fmtDate(l.date)) + (l.duration ? ' · ' + esc(l.duration) : '') + '</span></span>' +
      '<span class="pill ' + (d ? 'done' : r ? 'todo' : 'prep') + '">' + (d ? '복습 완료' : r ? '안 들음' : '준비 중') + '</span></button>';
  });
  return h + '</div>';
}
function bindNo(scope, c) {
  scope.querySelectorAll('[data-no]').forEach(b => b.addEventListener('click', () => go('#' + c.id + '-' + b.dataset.no)));
}
function bindClass(c, lec) {
  const app = $('#app');
  bindNo(app, c);
  if (!lec) return;
  app.querySelectorAll('[data-seek]').forEach(b => b.addEventListener('click', () => {
    const id = ytId(lec.video); if (!id) return; $('#playerBox').innerHTML = playerFrame(id, +b.dataset.seek, true);
    $('#playerBox').scrollIntoView({ block: 'center', behavior: 'smooth' });
  }));
  app.querySelectorAll('.qa').forEach(b => b.addEventListener('click', () => b.classList.toggle('open')));
  const db = $('#doneBtn'); if (db) db.addEventListener('click', () => { const y = window.scrollY; store.set(c.id, lec.no, !store.get(c.id, lec.no)); viewClass(c, lec.no); window.scrollTo(0, y); });
  const sb = $('#shareBtn'); if (sb) sb.addEventListener('click', () => {
    const url = location.href.split('#')[0] + '#' + c.id + '-' + lec.no, done = () => { const x = $('#copied'); x.textContent = '복사했어요'; setTimeout(() => { const y = $('#copied'); if (y) y.textContent = ''; }, 1800); };
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => { $('#copied').textContent = url; }); else $('#copied').textContent = url;
  });
  const se = $('#search'); if (se) se.addEventListener('input', () => { qFilter = se.value; const box = $('#lectureList'); box.innerHTML = listHtml(c, lec); bindNo(box, c); });
}

route();
</script>
